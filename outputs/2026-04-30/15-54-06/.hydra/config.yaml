is_decoder: true
data:
  batch_size: 4
  unk_freq_threshold: 0.0
  min_workers: 0
  global_diagnoses: false
  repeating_events: true
  path_to_db: ${oc.env:SURVIVEHR_DB_PATH,null}
  path_to_ds: ${oc.env:SURVIVEHR_DS_PATH,null}
  meta_information_path: ${oc.env:SURVIVEHR_META_PATH,null}
  subsample_training: null
experiment:
  type: pre-train
  project_name: SurvivEHR
  run_id: crPreTrain_demo_cpu
  fine_tune_id: null
  notes: Local laptop run
  tags:
  - local
  - macos
  train: true
  test: true
  verbose: true
  seed: 1337
  log: false
  log_dir: ./outputs/
  ckpt_dir: ./outputs/checkpoints/
fine_tuning:
  fine_tune_outcomes: null
  custom_outcome_method:
    _target_: null
  custom_stratification_method:
    _target_: null
  use_callbacks:
    hidden_embedding:
      num_batches: 0
      mask_static: false
      mask_value: false
    performance_metrics: false
    rmst: false
  compression_layer: false
  llrd: null
  PEFT:
    method: null
    adapter_dim: 8
  backbone:
    linear_probe_epochs: 0
    unfreeze_top_k: null
  head:
    surv_weight: 1
    value_weight: 0
    learning_rate: 0.0005
optim:
  num_epochs: 1
  learning_rate: 0.0003
  scheduler_warmup: true
  scheduler: decaycawarmrestarts
  scheduler_periods: 10000
  learning_rate_decay: 0.8
  val_check_interval: 1
  early_stop: true
  early_stop_patience: 30
  log_every_n_steps: 20
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  accumulate_grad_batches: 1
transformer:
  block_type: Neo
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  layer_norm_bias: false
  attention_type: global
  bias: true
  dropout: 0.0
  attention_dropout: 0.0
  resid_dropout: 0.0
  private_heads: 0
head:
  SurvLayer: cr
  surv_weight: 1
  tokens_for_univariate_regression: None
  value_weight: 0.1
