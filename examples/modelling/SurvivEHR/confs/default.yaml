is_decoder: True

data:
  batch_size: 16
  unk_freq_threshold: 0.0
  min_workers: 2
  global_diagnoses: False
  repeating_events: True
  path_to_db: ${oc.env:SURVIVEHR_DB_PATH,null}
  path_to_ds: ${oc.env:SURVIVEHR_DS_PATH,null}
  meta_information_path: ${oc.env:SURVIVEHR_META_PATH,null}
  subsample_training: null

experiment:
  type: "pre-train"
  project_name: SurvivEHR
  run_id: ${head.SurvLayer}PreTrain_local_${experiment.seed}
  fine_tune_id: null
  notes: "Local laptop run"
  tags: ["local", "macos"]
  train: True
  test: True
  verbose: True
  seed: 1337
  log: False
  log_dir: ./outputs/
  ckpt_dir: ./outputs/checkpoints/

fine_tuning:
  fine_tune_outcomes: null
  custom_outcome_method:
    _target_: null
  custom_stratification_method:
    _target_: null
  use_callbacks:
    hidden_embedding:
      num_batches: 1
      mask_static: False
      mask_value: False
    performance_metrics: True
    rmst: False
  compression_layer: False
  llrd: null
  PEFT:
    method: null
    adapter_dim: 8
  backbone:
    linear_probe_epochs: 0
    unfreeze_top_k: null
  head:
    surv_weight: 1
    value_weight: 0
    learning_rate: 5e-4

optim:
  num_epochs: 1
  learning_rate: 3e-4
  scheduler_warmup: True
  scheduler: decaycawarmrestarts
  scheduler_periods: 10000
  learning_rate_decay: 0.8
  val_check_interval: 2500
  early_stop: True
  early_stop_patience: 30
  log_every_n_steps: 20
  limit_val_batches: 0.025
  limit_test_batches: null
  accumulate_grad_batches: 1

transformer:
  block_type: "Neo"
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  layer_norm_bias: False
  attention_type: "global"
  bias: True
  dropout: 0.0
  attention_dropout: 0.0
  resid_dropout: 0.0
  private_heads: 0

head:
  SurvLayer: "cr"
  surv_weight: 1
  tokens_for_univariate_regression: None
  value_weight: 0.1
